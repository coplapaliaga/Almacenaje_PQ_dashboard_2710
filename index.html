<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almacenaje Puerto Quijarro</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{--bg:#070b14;--bg2:#0d1424;--bg3:#141d33;--bg4:#1b2643;--accent:#00d4ff;--accent2:#ff6b35;--accent3:#00ff9d;--accent4:#ffd93d;--accent5:#a78bff;--accent6:#ff69b4;
--text:#e6edfb;--text-dim:#8296b4;--text-mute:#5b6d8a;--border:#1e2d4a;--border-soft:rgba(120,160,220,.10);--border-hair:rgba(120,160,220,.06);
--shadow-1:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.25);--shadow-2:0 2px 4px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
--glass:linear-gradient(168deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.018) 34%,rgba(255,255,255,0) 68%);--glass-edge:inset 0 1px 0 rgba(255,255,255,.09);
--r-sm:8px;--r-md:14px;--r-lg:20px;--ease:cubic-bezier(.22,.61,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Exo 2',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:clip;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,212,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.028) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 120% 80% at 50% 0%,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse 120% 80% at 50% 0%,#000 30%,transparent 78%)}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(760px 420px at 12% -6%,rgba(0,212,255,.10),transparent 62%),radial-gradient(680px 400px at 88% 4%,rgba(167,139,255,.07),transparent 60%)}
.container{position:relative;z-index:1;max-width:1800px;margin:0 auto;padding:22px 20px 20px}
header{text-align:center;padding:34px 20px 26px;border-bottom:1px solid var(--border-soft);margin-bottom:24px;position:relative}
header::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:340px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 18px rgba(0,212,255,.55)}
.header-tag{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:12px;opacity:.85}
h1{font-family:'Rajdhani',sans-serif;font-size:clamp(24px,3.2vw,40px);font-weight:700;letter-spacing:2px;text-transform:uppercase;line-height:1.05}
h1 span{color:var(--accent);text-shadow:0 0 28px rgba(0,212,255,.45)}
.subtitle{margin-top:9px;font-size:13px;color:var(--text-dim);font-weight:300;letter-spacing:1px}
.subtitle b{color:var(--text);font-weight:600}
.period-badge{display:inline-block;margin-top:14px;padding:5px 18px;border:1px solid rgba(0,212,255,.42);border-radius:999px;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--accent);background:rgba(0,212,255,.06)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{font-family:'Share Tech Mono',monospace;font-size:12px;background:rgba(255,255,255,.035);color:var(--text);border:1px solid var(--border-soft);border-radius:9px;padding:8px 15px;cursor:pointer;transition:all .2s var(--ease)}
.btn:hover{border-color:var(--accent);background:rgba(0,212,255,.07)}
.btn.primary{background:linear-gradient(180deg,rgba(0,212,255,.24),rgba(0,212,255,.10));border-color:rgba(0,212,255,.6);color:#cdf4ff;font-weight:700}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.msg{display:none;margin:0 0 16px;padding:10px 14px;border-radius:var(--r-sm);border:1px solid var(--border-soft);background:var(--bg3);font-size:13px}
.msg.show{display:block}.msg.ok{border-left:4px solid var(--accent3)}.msg.warn{border-left:4px solid var(--accent4)}.msg.err{border-left:4px solid var(--accent2)}
.msg ul{margin:6px 0 0 18px}
.drop{border:2px dashed var(--accent);border-radius:12px;padding:18px;text-align:center;color:var(--accent);display:none;margin-bottom:14px}
body.dragging .drop{display:block}
.kpi-grid{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:26px}
.kpi-card{flex:1 1 190px;min-width:0;position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--border-soft);border-radius:var(--r-md);padding:20px 18px 18px;box-shadow:var(--shadow-1),var(--glass-edge);transition:transform .32s var(--ease)}
.kpi-card:hover{transform:translateY(-4px)}
.kpi-card::after{content:'';position:absolute;inset:0;z-index:-1;background:var(--glass);pointer-events:none}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi-card.hero{flex:2.2 1 300px}.kpi-card.hero .kpi-value{font-size:clamp(34px,3.4vw,46px)}
.kpi-icon{font-size:22px;margin-bottom:10px;display:block}
.kpi-label{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.6px;margin-bottom:10px}
.kpi-value{font-family:'Rajdhani',sans-serif;font-size:clamp(28px,2.4vw,36px);font-weight:700;line-height:.98;display:block}
.kpi-unit{font-size:13px;font-weight:500;opacity:.62;margin-left:5px}
.kpi-det{font-size:11px;color:var(--text-dim);margin-top:8px}.kpi-det b{color:var(--text)}
.kpi-card.blue{background:linear-gradient(160deg,rgba(0,212,255,.11),var(--bg2) 100%)}.kpi-card.blue::before{background:linear-gradient(90deg,var(--accent),transparent 85%)}.kpi-card.blue .kpi-value{color:var(--accent)}
.kpi-card.yellow{background:linear-gradient(160deg,rgba(255,217,61,.10),var(--bg2) 100%)}.kpi-card.yellow::before{background:linear-gradient(90deg,var(--accent4),transparent 85%)}.kpi-card.yellow .kpi-value{color:var(--accent4)}
.kpi-card.orange{background:linear-gradient(160deg,rgba(255,107,53,.11),var(--bg2) 100%)}.kpi-card.orange::before{background:linear-gradient(90deg,var(--accent2),transparent 85%)}.kpi-card.orange .kpi-value{color:var(--accent2)}
.kpi-card.green{background:linear-gradient(160deg,rgba(0,255,157,.10),var(--bg2) 100%)}.kpi-card.green::before{background:linear-gradient(90deg,var(--accent3),transparent 85%)}.kpi-card.green .kpi-value{color:var(--accent3)}
.filter-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(20,29,51,.93),rgba(13,20,36,.88));border:1px solid var(--border-soft);border-radius:var(--r-md);padding:14px 18px;margin-bottom:22px;box-shadow:var(--shadow-2)}
.filter-label{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text-mute);text-transform:uppercase;white-space:nowrap}
.filter-btn-grp{display:flex;gap:5px;flex-wrap:wrap}
.filter-btn-grp button,.filter-select,input[type=search]{font-family:'Share Tech Mono',monospace;font-size:12px;background:rgba(255,255,255,.035);color:var(--text);border:1px solid var(--border-soft);border-radius:9px;padding:7px 14px;cursor:pointer;outline:none;transition:all .2s var(--ease)}
.filter-btn-grp button:hover:not(.active),.filter-select:hover,.filter-select:focus,input[type=search]:focus{border-color:var(--accent);background:rgba(0,212,255,.07)}
.filter-btn-grp button.active{background:linear-gradient(180deg,rgba(0,212,255,.24),rgba(0,212,255,.10));border-color:rgba(0,212,255,.6);color:#cdf4ff;font-weight:700}
.filter-select option{background:var(--bg3);color:var(--text)}
input[type=search]{cursor:text;min-width:230px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-bottom:24px;align-items:start}
.chart-card{position:relative;isolation:isolate;background:linear-gradient(168deg,var(--bg3) 0%,var(--bg2) 62%,#0b1220 100%);border:1px solid var(--border-soft);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow-2),var(--glass-edge);margin-bottom:24px;min-width:0}
.grid2 .chart-card{margin-bottom:0}
.chart-card::after{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--glass);pointer-events:none}
.card-title{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;padding-bottom:13px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-bottom:1px solid var(--border-hair)}
.card-title .dot{width:7px;height:7px;margin:0;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.card-title .dot.orange{background:var(--accent2);box-shadow:0 0 10px var(--accent2)}.card-title .dot.green{background:var(--accent3);box-shadow:0 0 10px var(--accent3)}.card-title .dot.yellow{background:var(--accent4);box-shadow:0 0 10px var(--accent4)}.card-title .dot.purple{background:var(--accent5);box-shadow:0 0 10px var(--accent5)}
.hint{color:var(--text-dim);font-size:12px;margin:8px 0 14px}
.chartbox{position:relative;height:360px}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px;margin-bottom:16px}
.mini b{display:block;font-family:'Rajdhani',sans-serif;font-size:24px;color:var(--accent4)}.mini span{color:var(--text-dim);font-size:12px}
.data-table-wrap{overflow:auto;max-height:460px;border-radius:var(--r-sm);border:1px solid var(--border-hair);scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;font-family:'Share Tech Mono',monospace;white-space:nowrap}
.data-table th{position:sticky;top:0;z-index:2;padding:11px 13px;background:linear-gradient(180deg,#18223c,#131c31);color:var(--text-dim);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;border-bottom:1px solid var(--border);text-align:center}
.data-table td{padding:10px 13px;border-bottom:1px solid var(--border-hair);text-align:center}
.data-table tbody tr:nth-child(even) td{background:rgba(255,255,255,.016)}
.data-table tbody tr:hover td{background:rgba(0,212,255,.08);color:#fff}
.data-table tfoot td{position:sticky;bottom:0;background:#131c31;font-weight:700;color:var(--accent3);border-top:1px solid var(--border)}
.tag{display:inline-block;padding:3px 11px;border-radius:999px;font-size:11px;border:1px solid var(--border);color:var(--text)}
.tag.pend{color:var(--accent4);border-color:rgba(255,217,61,.5);background:rgba(255,217,61,.08)}.tag.si{color:var(--accent3);border-color:rgba(0,255,157,.4)}
.empty{color:var(--text-dim);padding:18px 4px}
footer{text-align:center;padding:30px 12px 18px;font-size:11px;color:var(--text-mute);font-family:'Share Tech Mono',monospace;letter-spacing:1.2px;border-top:1px solid var(--border-soft);margin-top:30px;line-height:1.7}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:11px;border:2px solid var(--bg)}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
@media(max-width:768px){.container{padding:12px}.kpi-card{flex:1 1 calc(50% - 7px);padding:14px 13px}.kpi-card.hero{flex:1 1 100%}.kpi-value{font-size:24px}.chartbox{height:300px}.data-table th,.data-table td{padding:7px 8px;font-size:10px}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-tag">⬡ Sistema de Monitoreo Industrial</div>
    <h1>Almacenaje <span>Puerto Quijarro</span></h1>
    <p class="subtitle" id="source">Cargando…</p>
    <div class="actions">
      <label class="btn primary" for="file">⬆ Cargar Excel actualizado</label>
      <input type="file" id="file" accept=".xlsx,.xlsm,.xls">
      <button class="btn" id="reset" hidden>Volver a los datos publicados</button>
    </div>
  </header>
  <div class="drop">Suelta aquí el archivo Excel (.xlsx / .xlsm)</div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="kpi-grid" id="kpis"></div>
  <div class="filter-bar"><span class="filter-label">⬡ Liquidación</span><div class="filter-btn-grp" id="filters"></div></div>
  <div class="grid2">
    <section class="chart-card" id="chartCard"></section>
    <section class="chart-card" id="pendCard"></section>
  </div>
  <section class="chart-card" id="invCard" style="margin-top:24px"></section>
  <section class="chart-card" id="detCard"></section>
  <footer id="foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Lector del Excel: busca hojas y columnas por nombre de encabezado (no por posición fija). */
function normTxt(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
function isNum(v){return typeof v==='number'&&isFinite(v);}
function serialToISO(n){if(!isNum(n))return null;return new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000).toISOString().slice(0,10);}
function isoToSerial(s){if(!s)return NaN;var p=String(s).split('-');return Math.round((Date.UTC(+p[0],+p[1]-1,+p[2])-Date.UTC(1899,11,30))/86400000);}
function findHeader(rows,tests){
  for(var r=0;r<Math.min(rows.length,400);r++){
    var cells=(rows[r]||[]).map(normTxt);
    if(tests.every(function(t){return cells.some(t);}))return r;
  }
  return -1;
}
function colMap(row,spec){
  var cells=(row||[]).map(normTxt),m={};
  Object.keys(spec).forEach(function(k){var i=cells.findIndex(spec[k]);if(i>=0)m[k]=i;});
  return m;
}
function parseWorkbook(XLSX,wb,meta){
  meta=meta||{};
  var warnings=[];
  function sheet(f){var n=wb.SheetNames.find(function(x){return f(normTxt(x));});return n?wb.Sheets[n]:null;}
  var wsLiq=sheet(function(n){return n.indexOf('liquidacion')>=0&&n.indexOf('almacenaje')>=0;});
  var wsIn=sheet(function(n){return n==='in'||n==='datos';});
  var wsOut=sheet(function(n){return n==='out'||n.indexOf('lista salida')>=0;});
  if(!wsLiq)throw new Error('No encontré la hoja "LIQUIDACION ALMACENAJE".');
  var rowsOf=function(ws){return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});};
  var L=rowsOf(wsLiq);

  /* ---- tabla de lotes (parte superior) ---- */
  var lots=[];
  var hl=findHeader(L,[function(c){return /^n.{0,2}\s?lote$/.test(c);},function(c){return c.indexOf('costo del lote')>=0;}]);
  if(hl<0)warnings.push('No encontré la tabla de lotes (encabezado "N° Lote").');
  else{
    var cl=colMap(L[hl],{
      n:function(c){return /^n.{0,2}\s?lote$/.test(c);},
      ton:function(c){return c.indexOf('tonelaje')===0;},
      maxArr:function(c){return c.indexOf('arribo')>=0;},
      fl:function(c){return c.indexOf('liquidaci')>=0;},
      dias:function(c){return c.indexOf('dias')>=0;},
      acum:function(c){return c.indexOf('acumulado')===0;},
      costo:function(c){return c.indexOf('costo del lote')>=0;},
      costoAcum:function(c){return c.indexOf('costo acumulado')>=0;},
      fe:function(c){return c==='fe';},
      crt:function(c){return c==='crt';},
      suma:function(c){return c==='suma';},
      pago:function(c){return c.indexOf('pago')>=0;},
      cliente:function(c){return c==='cliente';},
      obs:function(c){return c.indexOf('onserv')>=0||c.indexOf('observ')>=0;}
    });
    for(var r=hl+1;r<Math.min(L.length,hl+80);r++){
      var row=L[r]||[];
      var first=row.find(function(v){return typeof v==='string'&&v.trim();});
      if(first&&normTxt(first).indexOf('total')===0)break;
      var n=row[cl.n],ton=row[cl.ton];
      if(!isNum(n)||!isNum(ton)||ton<=0)continue;
      lots.push({n:n,ton:ton,maxArr:serialToISO(row[cl.maxArr]),fl:serialToISO(row[cl.fl]),dias:isNum(row[cl.dias])?row[cl.dias]:null,
        acum:row[cl.acum],costo:isNum(row[cl.costo])?row[cl.costo]:0,costoAcum:row[cl.costoAcum],
        fe:row[cl.fe],crt:serialToISO(row[cl.crt]),suma:serialToISO(row[cl.suma]),
        pago:row[cl.pago]==null?'':String(row[cl.pago]).trim(),cliente:row[cl.cliente]==null?'':String(row[cl.cliente]).trim(),
        obs:row[cl.obs]==null?'':String(row[cl.obs]).trim()});
    }
  }

  /* ---- detalle por camión ---- */
  var detail=[];
  var hd=findHeader(L,[function(c){return c==='lote';},function(c){return c.indexOf('peso liquidado')>=0;}]);
  if(hd<0)throw new Error('No encontré la tabla "DETALLE POR CAMIÓN" (columnas "Lote" y "Peso liquidado").');
  var cd=colMap(L[hd],{
    n:function(c){return c.charAt(0)==='n'&&c.indexOf('camion')>=0;},
    cond:function(c){return c==='conductor';},
    condOut:function(c){return c==='conductor out';},
    pIn:function(c){return c==='placa in'||c==='placa';},
    pOut:function(c){return c==='placa out';},
    arr:function(c){return c.indexOf('arribo')>=0;},
    fl:function(c){return c.indexOf('fecha')===0&&c.indexOf('liquid')>=0;},
    d:function(c){return c.indexOf('dias')===0;},
    fe:function(c){return c.indexOf('factura')>=0;},
    ton:function(c){return c.indexOf('tonelaje')===0;},
    ant:function(c){return c.indexOf('acum')>=0&&c.indexOf('anterior')>=0;},
    hasta:function(c){return c.indexOf('acum')>=0&&c.indexOf('hasta')>=0;},
    lote:function(c){return c==='lote';},
    pl:function(c){return c.indexOf('peso liquidado')>=0;},
    cost:function(c){return c.indexOf('costo almacenaje')>=0;},
    sal:function(c){return c.indexOf('saldo en peso')>=0;},
    vs:function(c){return c.indexOf('valor del saldo')>=0;},
    tar:function(c){return c.indexOf('tarifa')>=0;},
    liq:function(c){return /^liq\b/.test(c);},
    mes:function(c){return c==='mes';}
  });
  var txt=function(v){return v==null?'':String(v).trim();};
  for(var r2=hd+1;r2<L.length;r2++){
    var w=L[r2]||[];
    if(!isNum(w[cd.n]))break;
    var lote=w[cd.lote];
    detail.push({n:w[cd.n],cond:txt(w[cd.cond]),condOut:cd.condOut!=null?txt(w[cd.condOut]):'',pIn:txt(w[cd.pIn]),pOut:txt(w[cd.pOut]),
      arr:serialToISO(w[cd.arr]),fl:isNum(lote)?serialToISO(w[cd.fl]):null,d:isNum(w[cd.d])?w[cd.d]:null,
      fe:isNum(w[cd.fe])?w[cd.fe]:null,ton:isNum(w[cd.ton])?w[cd.ton]:0,ant:w[cd.ant],hasta:w[cd.hasta],
      lote:isNum(lote)?lote:null,pl:isNum(w[cd.pl])?w[cd.pl]:null,cost:isNum(w[cd.cost])?w[cd.cost]:null,
      sal:isNum(w[cd.sal])?w[cd.sal]:null,vs:isNum(w[cd.vs])?w[cd.vs]:null,tar:isNum(w[cd.tar])?w[cd.tar]:null,
      liq:txt(w[cd.liq]),mes:txt(w[cd.mes])});
  }
  if(cd.liq==null)warnings.push('No encontré la columna "LIQ, CO4": los lotes liquidados saldrán como "Sin asignar".');

  /* ---- parámetros de tarifa (hoja IN: Z1, AA1, AC1, AD1) ---- */
  var cell=function(a){return wsIn&&wsIn[a]&&isNum(wsIn[a].v)?wsIn[a].v:null;};
  var tarifa={t1:cell('Z1')!=null?cell('Z1'):40,d1:cell('AA1')!=null?cell('AA1'):30,tn:cell('AC1')!=null?cell('AC1'):10,dn:cell('AD1')!=null?cell('AD1'):10};
  if(!wsIn)warnings.push('No encontré la hoja IN: uso la tarifa por defecto.');

  /* ---- hoja IN (camiones que llegan) ---- */
  var inn=[];
  if(wsIn){
    var I=rowsOf(wsIn);
    var hi=findHeader(I,[function(c){return c==='conductor';},function(c){return c==='tonelaje';},function(c){return c==='fecha arribo pq';}]);
    if(hi>=0){
      var ci=colMap(I[hi],{
        cond:function(c){return c==='conductor';},placa:function(c){return c==='placa';},trans:function(c){return c==='transporte';},
        ton:function(c){return c==='tonelaje';},carg:function(c){return c.indexOf('carguio')>=0;},sal:function(c){return c.indexOf('salida')>=0;},
        arr:function(c){return c==='fecha arribo pq';},desc:function(c){return c.indexOf('descarga en pq')>=0;},

  var bars=steps.map(function(s){return '<tr><td>'+nf(s.tar)+' Bs/Tn</td><td style="width:40%"><div style="background:var(--accent4);opacity:.8;height:12px;border-radius:0 4px 4px 0;width:'+Math.max(2,s.tn/maxTn*100)+'%"></div></td><td>'+nf(s.tn)+' Tn</td><td>'+nf(s.vs)+' Bs</td></tr>';}).join('');
  $('pendCard').innerHTML=h+'<div class="mini"><div><b>'+nf(tn)+' Tn</b><span>peso en saldo</span></div><div><b>'+nf(vs)+' Bs</b><span>costo acumulado a hoy</span></div><div><b>'+nf(uniq(pend,'n'))+'</b><span>camiones con saldo</span></div><div><b>'+maxD+' días</b><span>el más antiguo (arribo '+fdate(oldest&&oldest.arr)+')</span></div></div>'+
    '<div class="card-title" style="margin-top:6px"><span class="dot orange"></span>Saldo por tarifa diaria</div><div class="data-table-wrap" style="margin-top:12px"><table class="data-table"><thead><tr><th>Tarifa</th><th></th><th>Peso</th><th>Costo a hoy</th></tr></thead><tbody>'+bars+'</tbody></table></div>';
}

/* ---- facturas ---- */
function renderInv(rows){
  var lotBy={};S.model.lots.forEach(function(l){lotBy[l.n]=l;});
  var g={};
  rows.forEach(function(r){if(r.pend||r.fe==null)return;var x=g[r.fe]||(g[r.fe]={fe:r.fe,lots:{},tn:0,cost:0,liq:r.liq});x.lots[r.lote]=1;x.tn+=r.pl||0;x.cost+=r.cost||0;});
  var list=Object.keys(g).map(function(k){return g[k];}).sort(function(a,b){return a.fe-b.fe;});
  var h='<div class="card-title"><span class="dot green"></span>Facturas (FE) a liquidar</div><p class="hint">Peso y costo de almacenaje por factura; una FE compartida por varios lotes suma sus lotes</p>';
  if(!list.length){$('invCard').innerHTML=h+'<div class="empty">No hay facturas liquidadas con este filtro.</div>';return;}
  $('invCard').innerHTML=h+'<div class="data-table-wrap"><table class="data-table"><thead><tr><th>FE</th><th>Lotes</th><th>Cliente</th><th>Liquidación</th><th>Peso (Tn)</th><th>Costo (Bs)</th><th>Pago</th></tr></thead><tbody>'+
    list.map(function(x){var ls=Object.keys(x.lots).map(Number).sort(function(a,b){return a-b;}),l0=lotBy[ls[0]]||{},ok=/^s/i.test(l0.pago||'');
      return '<tr><td>'+esc(x.fe)+'</td><td>'+esc(ls.join(', '))+'</td><td>'+dash(l0.cliente)+'</td><td><span class="tag" style="border-left:3px solid '+colorOf(x.liq)+'">'+esc(x.liq)+'</span></td><td>'+nf(x.tn)+'</td><td>'+nf(x.cost)+'</td><td>'+(l0.pago?'<span class="tag '+(ok?'si':'pend')+'">'+(ok?'Pagado':'Pago pendiente')+'</span>':'-')+'</td></tr>';}).join('')+
    '</tbody><tfoot><tr><td colspan="4">Total</td><td>'+nf(sum(list,'tn'))+'</td><td>'+nf(sum(list,'cost'))+'</td><td></td></tr></tfoot></table></div>';
}

/* ---- detalle por camión (filtros FE y Liquidación, sin Conductor OUT) ---- */
function renderDetail(rows){
  var fes=[];rows.forEach(function(r){if(r.fe!=null&&fes.indexOf(r.fe)<0)fes.push(r.fe);});fes.sort(function(a,b){return a-b;});
  if(S.dfe!=='all'&&fes.map(String).indexOf(S.dfe)<0)S.dfe='all';
  var lq=S.series.slice();if(rows.some(function(r){return r.pend;}))lq.push(PEND);
  if(S.dliq!=='all'&&lq.indexOf(S.dliq)<0)S.dliq='all';
  var q=S.q.trim().toLowerCase();
  var list=rows.filter(function(r){
    return (S.dfe==='all'||String(r.fe)===S.dfe)&&(S.dliq==='all'||r.liq===S.dliq)&&(!q||[r.cond,r.pIn,r.pOut,r.fe,r.lote,r.n].join(' ').toLowerCase().indexOf(q)>=0);
  });
  var keep=document.activeElement&&document.activeElement.id==='q';
  var pd=list.filter(function(r){return r.pend;});
  var bar='<div class="filter-bar" style="margin:12px 0 16px;box-shadow:none"><span class="filter-label">FE</span><select class="filter-select" id="dfe"><option value="all">Todas</option>'+fes.map(function(f){return '<option value="'+esc(f)+'"'+(String(f)===S.dfe?' selected':'')+'>'+esc(f)+'</option>';}).join('')+'</select>'+
    '<span class="filter-label">Liquidación</span><select class="filter-select" id="dliq"><option value="all">Todas</option>'+lq.map(function(s){return '<option value="'+esc(s)+'"'+(s===S.dliq?' selected':'')+'>'+esc(s===PEND?'Por liquidar':s)+'</option>';}).join('')+'</select>'+
    '<input type="search" id="q" placeholder="Buscar placa, conductor, FE o lote" value="'+esc(S.q)+'" aria-label="Buscar en el detalle"><span class="filter-label">'+nf(list.length)+' filas</span></div>';
  var act=S.dfe!=='all'||S.dliq!=='all'||q!=='';
  var lq1=list.filter(function(r){return !r.pend;});
  var tTn=sum(lq1,'pl')+sum(pd,'sal'),tBs=sum(lq1,'cost')+sum(pd,'vs');
  var what=[S.dfe!=='all'?'FE '+S.dfe:'',S.dliq!=='all'?(S.dliq===PEND?'Por liquidar':S.dliq):'',q?'búsqueda “'+esc(S.q.trim())+'”':''].filter(Boolean).join(' · ');
  var sumHtml=act?'<div class="kpi-grid" style="margin-bottom:16px">'+
    tile('green','⚖','Suma de pesos — '+esc(what),nf(tTn),'Tn','Liquidado <b>'+nf(sum(lq1,'pl'))+'</b> + por liquidar <b>'+nf(sum(pd,'sal'))+'</b> · '+nf(list.length)+' filas')+
    tile('orange','💰','Costo almacenaje — '+esc(what),nf(tBs),'Bs','Liquidado <b>'+nf(sum(lq1,'cost'))+'</b> + por liquidar <b>'+nf(sum(pd,'vs'))+'</b>')+'</div>':'';
  var head='<div class="card-title"><span class="dot purple"></span>Detalle por camión</div><p class="hint">Un camión por lote asignado; si su carga se reparte entre dos lotes aparece en dos filas. Saldo valorizado a hoy.</p>'+bar+sumHtml;
  var body=list.length?'<div class="data-table-wrap"><table class="data-table"><thead><tr><th>N°</th><th>Conductor</th><th>Placa IN</th><th>Placa OUT</th><th>Arribo</th><th>F. liquid.</th><th>Días</th><th>Tarifa</th><th>FE</th><th>Lote</th><th>Peso liq. (Tn)</th><th>Costo (Bs)</th><th>Saldo (Tn)</th><th>Valor saldo (Bs)</th><th>Liquidación</th></tr></thead><tbody>'+
    list.map(function(r){return '<tr><td>'+esc(r.n)+'</td><td>'+dash(r.cond)+'</td><td>'+dash(r.pIn)+'</td><td>'+dash(r.pOut)+'</td><td>'+fdate(r.arr)+'</td><td>'+fdate(r.fl)+'</td><td>'+dash(r.d)+'</td><td>'+dash(r.tar)+'</td><td>'+dash(r.fe)+'</td><td>'+dash(r.lote)+'</td><td>'+(r.pl?nf(r.pl):'-')+'</td><td>'+(r.cost?nf(r.cost):'-')+'</td><td>'+(r.pend&&r.sal?nf(r.sal):'-')+'</td><td>'+(r.pend&&r.vs?nf(r.vs):'-')+'</td><td>'+(r.pend?'<span class="tag pend">Por liquidar</span>':'<span class="tag" style="border-left:3px solid '+colorOf(r.liq)+'">'+esc(r.liq)+'</span>')+'</td></tr>';}).join('')+
    '</tbody><tfoot><tr><td colspan="10">Total</td><td>'+nf(sum(list,'pl'))+'</td><td>'+nf(sum(list,'cost'))+'</td><td>'+nf(sum(pd,'sal'))+'</td><td>'+nf(sum(pd,'vs'))+'</td><td></td></tr></tfoot></table></div>':'<div class="empty">Sin resultados.</div>';
  $('detCard').innerHTML=head+body;
  if(keep){var el=$('q');el.focus();el.setSelectionRange(el.value.length,el.value.length);}
}

/* ---- eventos ---- */
document.addEventListener('click',function(e){var b=e.target.closest('button');if(b&&b.dataset.liq!=null){S.liq=b.dataset.liq;render();}});
document.addEventListener('change',function(e){if(e.target.id==='dfe'){S.dfe=e.target.value;renderDetail(filtered());}else if(e.target.id==='dliq'){S.dliq=e.target.value;renderDetail(filtered());}});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;renderDetail(filtered());}});
$('reset').addEventListener('click',function(){try{localStorage.removeItem(KEY);}catch(e){}S.q='';S.dfe='all';S.dliq='all';setModel(EMBED,false);msg('ok','Volviste a los datos publicados con la página.');});

function loadFile(file){
  if(!file)return;
  if(typeof XLSX==='undefined'){msg('err','No se pudo cargar el lector de Excel (hace falta conexión a internet la primera vez). Reintenta.');return;}
  if(!/\.(xlsx|xlsm|xls)$/i.test(file.name)){msg('err','El archivo debe ser Excel (.xlsx, .xlsm o .xls).');return;}
  msg('ok','Leyendo <b>'+esc(file.name)+'</b>…');
  var rd=new FileReader();
  rd.onerror=function(){msg('err','No se pudo leer el archivo.');};
  rd.onload=function(ev){
    try{
      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      var m=parseWorkbook(XLSX,wb,{fileName:file.name,lastModified:file.lastModified,builtAt:new Date().toISOString()});
      if(!m.detail.length)throw new Error('La tabla de detalle por camión está vacía.');
      var notes=m.warnings.slice(),cd=sum(m.detail,'cost'),cl=sum(m.lots,'costo');
      if(m.lots.length&&Math.abs(cd-cl)>0.5)notes.push('El costo del detalle ('+nf(cd)+' Bs) no coincide con la suma de lotes ('+nf(cl)+' Bs). Revisa el Excel.');
      S.q='';S.liq='all';S.dfe='all';S.dliq='all';setModel(m,true);
      var saved=true;try{localStorage.setItem(KEY,JSON.stringify(m));}catch(e){saved=false;}
      msg(notes.length?'warn':'ok','Datos actualizados desde <b>'+esc(file.name)+'</b>: '+m.lots.length+' lotes, '+uniq(derive(m).rows,'n')+' camiones, '+nf(sum(m.detail,'ton'))+' Tn.'+(saved?' Quedan guardados en este navegador.':' (No se pudieron guardar en este navegador.)')+(notes.length?'<ul>'+notes.map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul>':''));
    }catch(err){msg('err','No pude leer ese Excel: '+esc(err.message||err));}
  };
  rd.readAsArrayBuffer(file);
}
$('file').addEventListener('change',function(e){loadFile(e.target.files[0]);e.target.value='';});
['dragenter','dragover'].forEach(function(t){window.addEventListener(t,function(e){if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>=0){e.preventDefault();document.body.classList.add('dragging');}});});
window.addEventListener('dragleave',function(e){if(!e.relatedTarget)document.body.classList.remove('dragging');});
window.addEventListener('drop',function(e){e.preventDefault();document.body.classList.remove('dragging');if(e.dataTransfer.files.length)loadFile(e.dataTransfer.files[0]);});

var start=EMBED,custom=false;
try{var raw=localStorage.getItem(KEY);if(raw){var st=JSON.parse(raw);if(st&&Array.isArray(st.detail)&&Array.isArray(st.lots)&&st.builtAt>EMBED.builtAt){start=st;custom=true;}}}catch(e){}
setModel(start,custom);
})();

</script>
</body>
</html>
